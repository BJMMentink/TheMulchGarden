name: Deploy The Mulch Garden to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site/src
          cp public/index.html public/styles.css public/runtime-config.js _site/
          cp -r src/* _site/src/
          sed -i "s|./styles.css|./styles.css?v=${GITHUB_SHA}|" _site/index.html
          sed -i "s|./src/app.js|./src/app.js?v=${GITHUB_SHA}|" _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
